[project]
name = "ai-daily-system"
version = "0.1.0"
description = "AI 日报自动采编系统"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "aiohttp>=3.9",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "jinja2>=3.1",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8",
    "lxml>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
