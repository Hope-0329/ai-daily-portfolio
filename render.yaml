services:
  - type: web
    name: ai-daily-dashboard
    runtime: docker
    plan: free
    healthCheckPath: /dashboard
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: OBSIDIAN_ENABLED
        value: "false"
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: AI_DAILY_DB
        value: /app/data/ai_daily.db
    disk:
      name: sqlite-data
      mountPath: /app/data
      sizeGB: 1

  - type: cron
    name: daily-report
    runtime: docker
    schedule: "0 23 * * *"
    plan: free
    dockerCommand: uv run run.py now
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: OBSIDIAN_ENABLED
        value: "false"
      - key: AI_DAILY_DB
        value: /app/data/ai_daily.db
    disk:
      name: sqlite-data
      mountPath: /app/data
      sizeGB: 1
